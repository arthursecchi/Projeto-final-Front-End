    <h1>Checklist de prevenção</h1>
    <p>Marque os cuidados que já fazem parte da sua rotina.</p>

    <fieldset>
      <legend>Saúde pessoal e ambiente</legend>
      <label><input type="checkbox"> Verifico se há água parada em casa uma vez por semana.</label>
      <label><input type="checkbox"> Lavo as mãos com água e sabão antes de preparar alimentos.</label>
      <label><input type="checkbox"> Confiro minha caderneta de vacinação com a unidade de saúde.</label>
    </fieldset>

    <fieldset>
      <legend>Cuidados com cães e gatos</legend>
      <label><input type="checkbox"> Lavo os potes de água e comida do meu animal.</label>
      <label><input type="checkbox"> Confiro as vacinas do meu animal com o veterinário.</label>
      <label><input type="checkbox"> Recolho as fezes do animal e lavo as mãos em seguida.</label>
    </fieldset>
